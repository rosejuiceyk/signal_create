[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "he3-pulse-sim"
version = "0.1.0"
description = "Foundations for a reproducible He-3 pulse simulation research package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.10,<4",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<2",
    "pytest>=7.4,<9",
    "ruff>=0.5,<1",
    "types-PyYAML>=6,<7",
]
[project.scripts]
he3sim = "he3sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
