schema_version: "1"
metadata:
  run_name: phaseC-synthetic-demo
  description: >-
    Correlated prompt-neutron demonstration configuration for Phase C
    continuous-signal analysis. All values are synthetic_demo; none represent
    a measured detector, preamplifier, digitizer, or reactor parameter.
  seed:
    value: 20260720
    status: synthetic_demo
    notes: Reproducible Phase C demonstration seed.
simulation:
  true_rate_cps:
    value: 2000.0
    status: synthetic_demo
    notes: Moderate demonstration rate for Phase C continuous signals.
  sample_rate_hz:
    value: 100000000.0
    status: synthetic_demo
    notes: 100 MS/s provides reasonable waveform resolution.
source_model:
  kind: correlated
  k_eff:
    value: 0.7
    status: synthetic_demo
    notes: Subcritical demonstration value; yields clear correlation strength.
  alpha:
    value: 1000.0
    status: synthetic_demo
    notes: Pure-prompt decay constant in s^-1; alpha_e from tau_d is ~1e5 s^-1.
  detection_efficiency:
    value: 0.3
    status: synthetic_demo
    notes: Moderate detection efficiency for demonstration SNRs.
  nu_bar:
    value: 2.5
    status: synthetic_demo
    notes: Demonstration multiplicity mean.
  nu_pmf:
    value: [0.0, 0.0, 0.5, 0.5]
    status: synthetic_demo
    notes: Arbitrary demonstration PMF with mean 2.5.
  source_rate_cps:
    value: 2000.0
    status: synthetic_demo
    notes: Chosen so S*epsilon/(1-k_eff) = 2000 cps.
  max_chain_generation: 128
  max_total_reactions: 2000000
observation:
  mode: fixed_duration
  duration_s:
    value: 0.5
    status: synthetic_demo
    notes: 0.5 s yields ~1000 events with moderate correlation; longer than Phase B.
spectrum:
  provider: parametric_he3
  full_energy_keV:
    value: 764.0
    status: synthetic_demo
  full_energy_sigma_keV:
    value: 12.0
    status: synthetic_demo
  full_energy_fraction:
    value: 0.5
    status: synthetic_demo
  proton_wall_fraction:
    value: 0.2
    status: synthetic_demo
  proton_wall_min_keV:
    value: 191.0
    status: synthetic_demo
  proton_wall_max_keV:
    value: 764.0
    status: synthetic_demo
  proton_wall_alpha:
    value: 1.5
    status: synthetic_demo
  proton_wall_beta:
    value: 2.0
    status: synthetic_demo
  triton_wall_fraction:
    value: 0.2
    status: synthetic_demo
  triton_wall_min_keV:
    value: 573.0
    status: synthetic_demo
  triton_wall_max_keV:
    value: 764.0
    status: synthetic_demo
  triton_wall_alpha:
    value: 1.5
    status: synthetic_demo
  triton_wall_beta:
    value: 2.0
    status: synthetic_demo
  double_wall_fraction:
    value: 0.1
    status: synthetic_demo
  double_wall_min_keV:
    value: 0.0
    status: synthetic_demo
  double_wall_max_keV:
    value: 764.0
    status: synthetic_demo
  double_wall_alpha:
    value: 1.2
    status: synthetic_demo
  double_wall_beta:
    value: 3.0
    status: synthetic_demo
amplitude:
  gain_V_per_keV:
    value: 0.0001
    status: synthetic_demo
  offset_V:
    value: 0.0
    status: synthetic_demo
  spread_std_V:
    value: 0.001
    status: synthetic_demo
  polarity:
    value: 1
    status: synthetic_demo
pulse_shape:
  tau_r_s:
    value: 0.000001
    status: synthetic_demo
    notes: Fast rise; alpha_e = 1/tau_d ≈ 100,000 s^-1 well-separated from alpha.
  tau_d_s:
    value: 0.00001
    status: synthetic_demo
    notes: 10 us decay; alpha_e >> alpha ensures clean separation.
waveform:
